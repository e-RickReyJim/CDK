# Docker Compose Configuration for CKD Stage Predictor
version: '3.8'

services:
  ckd-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ckd-stage-predictor
    image: ckd-predictor:latest
    ports:
      - "7870:7870"
    volumes:
      # Mount models for easy updates without rebuild
      - ./models:/app/models:ro
      # Mount data for reference
      - ./data:/app/data:ro
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7870
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:7870')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ckd-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ckd-network:
    driver: bridge

# Usage:
# Build and run: docker-compose up -d
# View logs:     docker-compose logs -f
# Stop:          docker-compose down
# Rebuild:       docker-compose up -d --build
