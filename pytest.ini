[pytest]
# Pytest Configuration for CKD Prediction Project
# ================================================

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Coverage options
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Strict markers
    --strict-markers
    # Show warnings
    -W default
    # Fail on first error (comment out for full test run)
    # -x

# Custom markers for test categorization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for workflows
    slow: Tests that take significant time
    model: Tests requiring model files
    visualization: Tests for plotting functions
    validation: Data validation tests
    performance: Performance and benchmark tests
    docker: Docker container tests

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
